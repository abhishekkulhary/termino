# Termino uses very_good_analysis, a strict lint set. The tree must stay
# warning-free: CI runs `flutter analyze --fatal-infos --fatal-warnings`.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  plugins:
    - riverpod_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # The relay is its own package with its own analysis_options and its own
    # CI step. Analysing it from here applies the app's ruleset to code that
    # never asked for it, and — because the root analyze runs before the relay
    # has been resolved — it reported 92 undefined-symbol errors for
    # package:test on a clean checkout. Invisible locally, where the relay
    # happens to have been resolved already.
    - tools/**
  errors:
    # Generated code and platform interop occasionally trip these; we want them
    # visible but not build-breaking during development. CI still fails on
    # anything left unresolved at commit time.
    todo: ignore
