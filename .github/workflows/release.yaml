name: Release

# Builds every platform and publishes the artifacts as a GitHub release.
#
# Signing and store uploads happen only where the corresponding secret exists.
# Nothing fails because a secret is missing — a fork should be able to build
# this project, and an unsigned artifact is more useful than a red run.
#
# ## The asset names are a contract
#
# The download buttons on the marketing site (site/js/download.js) look for
# these exact names, and `releases/latest/download/<name>` is a permanent link
# anyone can paste into a README or a chat:
#
#   Termino-macos.dmg              Termino-windows-x64.zip
#   Termino-windows-x64.msix       Termino-linux-x86_64.AppImage
#   Termino-android-universal.apk  Termino-android.aab
#   Termino-ios-unsigned.zip       Termino-web.tar.gz
#
# There is no version in a filename: the tag carries the version, and a stable
# name is what makes that permanent link possible. Each job stages its output
# into dist/ under the contracted name, and the publish job lists every file
# explicitly with fail_on_unmatched_files, so a rename fails the run rather
# than quietly removing a button from the site.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restore the signing key
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - run: flutter build appbundle --release

      # One universal APK rather than --split-per-abi. Play splits from the
      # bundle, so the per-ABI APKs served nobody: somebody sideloading wants
      # the single file that works on their phone. They were also an upgrade
      # trap — build.gradle.kts offsets versionCode by 1000 per ABI, so a split
      # APK and a universal one are not comparable versions.
      - run: flutter build apk --release

      - name: Name the artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab \
             dist/Termino-android.aab
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/Termino-android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Unsigned: signing needs a distribution certificate and a provisioning
      # profile, which cannot live in the repository. See docs/RELEASING.md.
      - run: flutter build ios --release --no-codesign

      # Zipped, not uploaded raw. Runner.app is a *directory*: uploading it
      # attaches every file inside the bundle to the release as a separate
      # asset — Info.plist, Runner, flutter_assets/... — which is junk, and it
      # pollutes the asset list the site's download script reads. `ditto`
      # rather than `zip` because it preserves the bundle's symlinks.
      - name: Name the artifacts
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app \
            dist/Termino-ios-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release

      # A DMG rather than a zip, because that is what a Mac user expects to
      # receive. hdiutil is part of macOS, so no extra tooling is needed.
      #
      # Unsigned and un-notarised: Gatekeeper will refuse it on first open, and
      # the site explains how to get past that.
      - name: Package a DMG
        run: |
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING" dist
          cp -R build/macos/Build/Products/Release/termino.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname Termino -srcfolder "$STAGING" \
            -ov -format UDZO dist/Termino-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

      # Zipped *before* msix:create, which writes its output into this same
      # directory — afterwards the zip would contain the installer too.
      #
      # The portable zip is what the site offers, because the MSIX is unsigned
      # (msix_config sets install_certificate: false and supplies no
      # certificate) and Windows will not install an MSIX it does not trust.
      # Unlike an unsigned .exe there is no "run anyway" for it. The MSIX still
      # ships, for anyone who has a certificate to sign it with.
      - name: Package a portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
                           -DestinationPath dist/Termino-windows-x64.zip

      - run: dart run msix:create --build-windows false

      - name: Name the installer
        shell: pwsh
        run: |
          $msix = Get-ChildItem build/windows/x64/runner/Release/*.msix |
                  Select-Object -First 1
          Copy-Item $msix.FullName dist/Termino-windows-x64.msix

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libfuse2 desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package an AppImage
        run: |
          APPDIR="$RUNNER_TEMP/Termino.AppDir"
          mkdir -p "$APPDIR/usr/bin" dist
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"
          cp assets/icon/icon.png "$APPDIR/termino.png"

          cat > "$APPDIR/termino.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Termino
          Comment=Terminal emulator and SSH client
          Exec=termino
          Icon=termino
          Categories=System;TerminalEmulator;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/termino" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            "$APPDIR" dist/Termino-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

      # For self-hosting. The web build is not what github.io serves — that is
      # the marketing site in site/ — because the web app needs a relay the
      # visitor would have to run themselves.
      - name: Bundle the reference relay alongside it
        run: |
          mkdir -p dist
          cp -r tools/relay build/web/relay-source
          tar czf dist/Termino-web.tar.gz -C build/web .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  publish:
    name: GitHub release
    needs: [android, ios, macos, windows, linux, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # merge-multiple flattens every job's dist/ into one directory, so the
      # file list below is the contract exactly as written.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # Published, not drafted: the site's download links resolve through
          # releases/latest, which skips drafts. Worth knowing that this makes
          # `git push --tags` a public act with no review step in between.
          draft: false
          # A tag with a hyphen — v1.1.0-rc1 — publishes as a prerelease, which
          # releases/latest also skips. Without this, tagging a candidate would
          # repoint every download button on the site at it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # A missing file is a red run, not a silently absent download.
          fail_on_unmatched_files: true
          files: |
            artifacts/Termino-macos.dmg
            artifacts/Termino-windows-x64.zip
            artifacts/Termino-windows-x64.msix
            artifacts/Termino-linux-x86_64.AppImage
            artifacts/Termino-android-universal.apk
            artifacts/Termino-android.aab
            artifacts/Termino-ios-unsigned.zip
            artifacts/Termino-web.tar.gz
