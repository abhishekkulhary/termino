name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  analyze:
    name: Analyze, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated sources are committed so that a fresh clone analyses and
      # builds without running a generator first. That only stays true if they
      # are kept current, which this checks.
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- '*.g.dart' '*.freezed.dart'

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Domain layer purity
        run: ./tool/check_domain_purity.sh

      # The relay is its own package, so the app's analyze and test do not
      # reach it.
      - name: Relay — analyze and test
        working-directory: tools/relay
        run: |
          dart pub get
          dart format --set-exit-if-changed .
          dart analyze --fatal-infos --fatal-warnings
          dart test

      # Goldens are excluded here and run on macOS instead — see the `goldens`
      # job. A golden is a rendered image, and Flutter does not promise the
      # same pixels across platforms: these were generated on macOS, and every
      # one of the 34 failed the first time this job ran on Linux, while the
      # other 782 tests passed.
      - name: Test
        run: flutter test -x golden --coverage

      - name: Coverage gate (domain + infrastructure)
        run: ./tool/check_coverage.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  # Goldens compare rendered images, and text rasterisation differs between
  # platforms — so they only mean anything on the platform that generated
  # them. They are checked here rather than dropped: this runs the whole tagged
  # set, which is the 34 image comparisons plus the behavioural tests that live
  # in the same files, so nothing goes unrun.
  #
  # If the goldens are ever regenerated on Linux instead, this job moves and
  # the exclusion in `analyze` goes with it.
  goldens:
    name: Goldens (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test -t golden

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/**

  # The marketing site is plain HTML with no toolchain, so this needs no
  # Flutter and no dependencies — it runs in seconds alongside the analysis.
  # It exists for one failure in particular: an absolute asset path works on a
  # local server and 404s on Pages, which serves a project site from a subpath.
  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the screenshots out of the golden tests
        run: ./tool/sync_site_images.sh
      - name: Check the site
        run: ./tool/check_site.sh

  # The local PTY cannot be exercised by `flutter test`: it needs the native
  # plugin loaded into a real app. These run against a real shell on a real
  # desktop, and are what covers local_pty_backend_ffi.dart.
  integration:
    name: Integration (${{ matrix.device }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, device: macos }
          - { os: ubuntu-latest, device: linux }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.device == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # One file at a time: on desktop, Flutter relaunches the app for each
      # test file, and a second launch inside one `flutter test` invocation
      # fails with "Unable to start the app on the device".
      - name: Integration tests
        run: |
          for suite in integration_test/*_test.dart; do
            echo "--- $suite"
            if [ "${{ matrix.device }}" = "linux" ]; then
              xvfb-run -a flutter test "$suite" -d linux
            else
              flutter test "$suite" -d macos
            fi
          done
        shell: bash

  build:
    name: Build ${{ matrix.target }}
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux }
          - { os: ubuntu-latest,  target: web }
          - { os: ubuntu-latest,  target: apk }
          - { os: macos-latest,   target: macos }
          - { os: macos-latest,   target: ios }
          - { os: windows-latest, target: windows }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # iOS cannot be codesigned on CI without secrets, and is never expected
      # to provide a local shell — see ARCHITECTURE.md.
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "ios" ]; then
            flutter build ios --debug --no-codesign
          else
            flutter build ${{ matrix.target }} --debug
          fi
        shell: bash
