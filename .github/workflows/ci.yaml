name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  analyze:
    name: Analyze, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Domain layer purity
        run: ./tool/check_domain_purity.sh

      - name: Test
        run: flutter test --coverage

      - name: Coverage gate (domain + infrastructure)
        run: ./tool/check_coverage.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  build:
    name: Build ${{ matrix.target }}
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux }
          - { os: ubuntu-latest,  target: web }
          - { os: ubuntu-latest,  target: apk }
          - { os: macos-latest,   target: macos }
          - { os: macos-latest,   target: ios }
          - { os: windows-latest, target: windows }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # iOS cannot be codesigned on CI without secrets, and is never expected
      # to provide a local shell — see ARCHITECTURE.md.
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "ios" ]; then
            flutter build ios --debug --no-codesign
          else
            flutter build ${{ matrix.target }} --debug
          fi
        shell: bash
