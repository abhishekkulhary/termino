name: termino_relay
description: >-
  A WebSocket-to-TCP relay that lets Termino's web build reach an SSH server.
  It forwards bytes and nothing else: SSH runs in the browser, so the relay
  only ever sees ciphertext.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.7.0
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^11.0.0
